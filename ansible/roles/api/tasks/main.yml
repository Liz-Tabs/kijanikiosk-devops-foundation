---
- name: Install API dependencies
  apt:
    name:
      - python3
      - python3-pip
      - python3-flask
      - git
    state: present
    update_cache: yes

- name: Create API application directory
  file:
    path: /opt/kijanikiosk-api
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'

- name: Create API placeholder application
  copy:
    dest: /opt/kijanikiosk-api/app.py
    content: |
      from flask import Flask

      app = Flask(__name__)

      @app.route("/")
      def home():
          return "KijaniKiosk API running"

      if __name__ == "__main__":
          app.run(host="0.0.0.0", port=5000)
- name: Create API systemd service
  template:
    src: kijanikiosk-api.service.j2
    dest: /etc/systemd/system/kijanikiosk-api.service

- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Start API service
  systemd:
    name: kijanikiosk-api
    state: started
    enabled: yes
