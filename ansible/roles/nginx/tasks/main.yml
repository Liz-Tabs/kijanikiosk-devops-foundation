---
- name: Install nginx
  apt:
    name: nginx
    state: present
    update_cache: yes


- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent


- name: Configure KijaniKiosk nginx
  template:
    src: kijanikiosk.conf.j2
    dest: /etc/nginx/sites-available/kijanikiosk.conf


- name: Enable KijaniKiosk nginx site
  file:
    src: /etc/nginx/sites-available/kijanikiosk.conf
    dest: /etc/nginx/sites-enabled/kijanikiosk.conf
    state: link


- name: Restart nginx
  systemd:
    name: nginx
    state: restarted
    enabled: yes
